<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HangarHero - Fault Isolation Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; }
    
    /* Layout */
    #sidebar { width: 260px; background: #1e293b; padding: 20px; border-right: 1px solid #334155; display: flex; flex-direction: column; gap: 20px; }
    #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #top-bar { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    #table-container { flex: 1; overflow-y: auto; padding: 20px; }
    #detail-panel { width: 320px; background: #1e293b; border-left: 1px solid #334155; padding: 20px; display: none; }

    /* UI Components */
    h2, h3 { color: #38bdf8; margin-bottom: 10px; }
    select, input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; }
    button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #0369a1; }

    /* Matrix Table Grid */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
    tr:hover { background: #1e293b; cursor: pointer; }
    
    /* Flags */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-warning { background: #ef4444; color: #fff; }
    .badge-caution { background: #f59e0b; color: #fff; }
    .badge-advisory { background: #3b82f6; color: #fff; }
  </style>
</head>
<body>

  <!-- Sidebar: ATA & Filters -->
  <aside id="sidebar">
    <h2>HangarHero</h2>
    <div>
      <label for="platform-select">Aircraft Platform</label>
      <select id="platform-select">
        <option value="Gulfstream GV">Gulfstream GV</option>
        <option value="Gulfstream GIV">Gulfstream GIV</option>
        <option value="Gulfstream G450">Gulfstream G450</option>
        <option value="Gulfstream G550">Gulfstream G550</option>
        <option value="Global 6000">Bombardier Global 6000</option>
      </select>
    </div>

    <div>
      <label for="ata-filter">ATA Chapter Filter</label>
      <select id="ata-filter" onchange="loadFimEntries()">
        <option value="ALL">All Chapters</option>
        <option value="21">ATA 21 - Air Conditioning</option>
        <option value="24">ATA 24 - Electrical Power</option>
        <option value="27">ATA 27 - Flight Controls</option>
        <option value="29">ATA 29 - Hydraulic Power</option>
        <option value="32">ATA 32 - Landing Gear</option>
        <option value="73">ATA 73 - Engine Fuel & Control</option>
      </select>
    </div>
  </aside>

  <!-- Main Grid Area -->
  <main id="main-content">
    <div id="top-bar">
      <h3>Fault Isolation Matrix</h3>
      <button style="width: auto; padding: 8px 16px;" onclick="toggleAddModal()">+ Add Fault Entry</button>
    </div>

    <div id="table-container">
      <table>
        <thead>
          <tr>
            <th>ATA</th>
            <th>Fault / CAS Message</th>
            <th>Platform</th>
            <th>Severity</th>
            <th>Logged Date</th>
          </tr>
        </thead>
        <tbody id="fim-table-body">
          <tr><td colspan="5" style="text-align: center; color: #64748b;">Loading entries from Supabase...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Detail / Inspection Panel -->
  <aside id="detail-panel">
    <h3>Procedure Detail</h3>
    <div id="detail-content">Select a fault to view FIM steps, pinouts, and corrective actions.</div>
  </aside>

  <!-- Supabase CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==========================================
    // 1. EDIT YOUR SUPABASE CREDENTIALS HERE
    // ==========================================
    const SUPABASE_URL = "https://jdzxcubjppcnhlpaufev.supabase.co/";
    const SUPABASE_ANON_KEY = "YeyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkenhjdWJqcHBjbmhscGF1ZmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDg5NjcsImV4cCI6MjEwMzQyNDk2N30.QC0dmpseIfE_vB6C1tgwOJigCGlGl-dG7IXI_DT_IYI"; 
    
    // Initialize Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. FETCH DATA FROM SUPABASE (DESKTOP & MOBILE SYNC)
    // ==========================================
    async function loadFimEntries() {
      const tbody = document.getElementById('fim-table-body');
      const ataFilter = document.getElementById('ata-filter').value;
      const platformSelect = document.getElementById('platform-select').value;

      try {
        let query = supabaseClient
          .from('fims')
          .select('*')
          .eq('platform', platformSelect)
          .order('created_at', { ascending: false });

        if (ataFilter !== 'ALL') {
          query = query.eq('ata_chapter', ataFilter);
        }

        const { data: entries, error } = await query;

        if (error) {
          console.error("Error fetching data:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="color: #ef4444; text-align: center;">Error loading records. Check console/RLS settings.</td></tr>`;
          return;
        }

        if (!entries || entries.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">No fault entries found for this aircraft.</td></tr>`;
          return;
        }

        // Render Table Rows
        tbody.innerHTML = entries.map(entry => `
          <tr onclick="showDetail('${entry.id}')">
            <td><strong>ATA ${entry.ata_chapter || 'N/A'}</strong></td>
            <td>${entry.fault_title || 'Unknown Fault'}</td>
            <td>${entry.platform}</td>
            <td><span class="badge badge-${(entry.severity || 'advisory').toLowerCase()}">${entry.severity || 'ADVISORY'}</span></td>
            <td>${new Date(entry.created_at).toLocaleDateString()}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error("Unexpected error:", err);
      }
    }

    // ==========================================
    // 3. WRITE NEW DATA TO SUPABASE
    // ==========================================
    async function saveNewFimEntry(faultTitle, ataChapter, severity, procedureDetails) {
      const platform = document.getElementById('platform-select').value;

      const newRecord = {
        fault_title: faultTitle,
        ata_chapter: ataChapter,
        platform: platform,
        severity: severity,
        details: procedureDetails
      };

      const { data, error } = await supabaseClient
        .from('fims')
        .insert([newRecord]);

      if (error) {
        alert("Failed to save entry: " + error.message);
        return;
      }

      // Re-fetch database entries to sync table view
      loadFimEntries();
    }

    // Load table data when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      loadFimEntries();
      
      // Auto-reload matrix when user switches aircraft platform
      document.getElementById('platform-select').addEventListener('change', loadFimEntries);
    });
  </script>
</body>
</html>
